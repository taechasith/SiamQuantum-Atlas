services:
  hono:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siamquantum-hono
    restart: unless-stopped
    environment:
      SQLITE_PATH: /data/processed/siamquantum_atlas.db
      PORT: 8766
      NODE_ENV: ${SIAMQUANTUM_ENV:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-qatlas-storage}
    volumes:
      - ./data:/data
    expose:
      - '8766'

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    container_name: siamquantum-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8765}:8765"
    depends_on:
      - hono
