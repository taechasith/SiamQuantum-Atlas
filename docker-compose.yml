# SiamQuantum Atlas — Local PostgreSQL + Hono + Caddy
services:
  postgres:
    image: postgres:16-alpine
    container_name: siamquantum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-siamquantum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-siamquantum_atlas}
    expose:
      - '5432'
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - siamquantum_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-siamquantum} -d $${POSTGRES_DB:-siamquantum_atlas}']
      interval: 5s
      timeout: 3s
      retries: 10

  hono:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siamquantum-hono
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-siamquantum}:${POSTGRES_PASSWORD:-changeme-dev-password}@postgres:5432/${POSTGRES_DB:-siamquantum_atlas}
      PORT: 8766
      NODE_ENV: ${SIAMQUANTUM_ENV:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    expose:
      - '8766'
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    container_name: siamquantum-caddy
    restart: unless-stopped
    ports:
      - "${PORT:-8765}:8765"
    depends_on:
      - hono

volumes:
  siamquantum_pgdata:
